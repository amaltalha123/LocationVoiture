<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="UTF-8">
   <title>Liste des Managers</title>
   <style>
      :root {
         --baseColor: #398B93;
         --borderRadius: 10px;
         --imageBig: 100px;
         --imageSmall: 60px;
         --padding: 10px;
      }

      * {
         box-sizing: border-box;
      }

      body {
         margin: 0;
         height: 100vh;
         display: flex;
         align-items: center;
         justify-content: center;
         background-color: #d6ecee;
         font-family: Arial, sans-serif;
      }

      .container {
         display: flex;
         flex-direction: column;
         align-items: center;
      }

      .header {
         background-color: #327c83;
         color: white;
         font-size: 1.5em;
         padding: 1rem;
         text-align: center;
         text-transform: uppercase;
         border-top-left-radius: var(--borderRadius);
         border-top-right-radius: var(--borderRadius);
         width: 100%;
      }

      .table-users {
         border: 1px solid #718789;
         border-radius: var(--borderRadius);
         box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
         width: 800px;
         background: #fff;
         overflow: hidden;
      }

      .add-btn {
         display: block;
         width: fit-content;
         margin: 1em auto;
         padding: 0.5em 1em;
         background-color: #398B93;
         color: white;
         text-decoration: none;
         border-radius: 5px;
         font-weight: bold;
      }

      table {
         width: 100%;
         border-collapse: collapse;
      }

      td, th {
         color: #2b6d72;
         padding: var(--padding);
         border-bottom: 1px solid #ddd;
         text-align: center;
         vertical-align: middle;
      }

      th {
         background-color: #eaf6f7;
         font-weight: 500;
      }

      tr:nth-child(even) {
         background-color: #f9f9f9;
      }

      tr:hover {
         background-color: #f1f1f1;
      }

      .actions a {
         margin: 0 5px;
         color: #398B93;
         text-decoration: none;
         font-weight: bold;
      }

      .actions a:hover {
         text-decoration: underline;
      }
   </style>
</head>
<body>
   <div class="container">
      <div class="table-users">
         <div class="header">Managers</div>

<a href="{% url 'gestion_admin:ajouter_manager' %}">Ajouter Manager</a>

         <table>
            <thead>
               <tr>
                  <th>Nom</th>
                  <th>Prénom</th>
                  <th>Email</th>
                  <th>Téléphone</th>
                  <th>Agence</th>
                  <th>Actions</th>
               </tr>
            </thead>
            <tbody>
               {% for manager in managers %}
               <tr>
                  <td>{{ manager.nom }}</td>
                  <td>{{ manager.prenom }}</td>
                  <td>{{ manager.email }}</td>
                  <td>{{ manager.telephone }}</td>
                  <td>{{ manager.agence }}</td>
                  <td class="actions">
<a href="{% url 'gestion_admin:modifier_manager' manager_id=manager.id %}">Modifier</a>
<a href="{% url 'gestion_admin:supprimer_manager' manager.id %}">Supprimer</a>
                  </td>
               </tr>
               {% empty %}
               <tr>
                  <td colspan="6">Aucun manager trouvé.</td>
               </tr>
               {% endfor %}
            </tbody>
         </table>
      </div>
   </div>
</body>
</html>
